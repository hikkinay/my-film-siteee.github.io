{% extends 'main/shablon.html' %}



{% block title %}
    Мои новости
{% endblock%}


{% block content %}
    <div class="features">
        <h1>Новости сайта</h1>
        {% if news %}
            {% for el in news %}
                <div class="your-class">
                    <h3>{{ el.title }}</h3>
                    <p>{{ el.anons }}</p>
                    <a href="{% url 'news-detail' el.id %}" class="btn btn-warning">Просмотреть детальнее</a>
                </div>
            {% endfor %}
        {% else %}
            <p> У вас нет записей</p>
        {% endif %}



    </div>
{% endblock %}
