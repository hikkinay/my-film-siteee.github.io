{% extends 'main/shablon.html' %}



{% block title %}
  Форма для добавления статьи ебать
{% endblock%}


{% block content %}
    <div class="features">
        <h1>Форма записи фильма</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.title }}<br>
            {{ form.anons }}<br>
            {{ form.full_text }}<br>
            {{ form.date }}<br>
            {{ form.image }}<br>
            <span>{{ error }}</span>


          <button class="btn btn-success" style="background-color: purple; color: white;" type="submit">Добавить запись</button>
        </form>

    </div>
{% endblock %}
